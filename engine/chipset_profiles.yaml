# PCBOv2: Chipset Profiles — единый источник истины.
# Используется Skills 2, 11, 13, 14.
# При выходе новых чипсетов — добавить запись сюда. Код не менять.

# schema_version меняется при изменении структуры (не данных).
meta:
  schema_version: "1.0"
  description: "Чипсет → PCIe gen, VRM tier, M.2 slots range. Единый источник для всех валидаторов."
  last_updated: "2026-06-04"

chipsets:
  # ── AM5 ──
  B650:
    pcie_gen: 4
    ram_slots_range: [2, 4]
    m2_slots_range: [1, 3]
    vrm_tier: "basic_stable"
    bifurcation: true       # крадёт линии GPU при 2+ M.2

  B650M:
