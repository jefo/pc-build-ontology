# PCBOv2 Budget Tiers — Minimum Viable Specification (MVS)
# v3.0 — MVS теперь проверяет CPU и RAM (не только MB).
# Tier matching удалён. Заменён на физические валидаторы:
#   - CPU_VRM: TDP → VRM tier (Skill 13)
#   - GPU_PCIe: lanes class → slot gen (Skill 14)
#   - Component Floor: intent-based bottleneck minimums (Skill 15)
#
# ⚠️ Temporal anchoring: recalibrate when reference prices shift ±15%.
# Last recalibration: 2026-06-04. Next check: 2026-07-04.

meta:
  schema_version: "2.1"
  reference_date: "2026-06-04"
  market_condition: "sanctions_rf_june_2026"
  currency: "RUB"
  market: "Россия, санкционные цены"
  next_recalibration_check: "2026-07-04"

  recalibration_triggers:
    price_shift_threshold_pct: 15
    reference_components:
      gpu_mid: "nvidia-rtx-5070"
      gpu_high: "nvidia-rtx-5080"
      cpu_mid: "amd-ryzen-7-7700"
      mb_mid: "msi-b650-tomahawk"
